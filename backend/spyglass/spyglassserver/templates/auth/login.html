{% load static %}

<!doctype html>
<html data-theme="dark" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Login</title>

		<!-- Tailwind CSS -->
		<link rel="stylesheet" href="/static/css/tailwind/output.css" />
        {% comment %} Tailwind CDN  {% endcomment %}
        <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"> 

		<!-- jQuery -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

		<!-- Font Awesome -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>

		<script src="/static/js/utils/components.js"></script>

		<script type="module" src="/static/js/config/ajax.js"></script>

		<link rel="shortcut icon" href="/static/favicon.ico" />
	</head>

	<body class="h-full w-full flex justify-around items-center flex-row bg-background-paper">
		{% csrf_token %}
		<div class="absolute top-0 flex justify-center items-center w-full h-full bg-background-paper backdrop-blur">
			<div class="w-full md:max-w-auto lg:max-w-[350px] p-6 mx-5 rounded-md shadow-md bg-background-default">
				<h2 class="mb-3 text-2xl font-semibold text-center text-secondary-main">Hi, Welcome to SpyGlassAI</h2>
				<p class="text-sm text-center text-gray-400">Enter your credentials to continue</p>
				<div class="my-6 space-y-4">
					<button
						id="linkedin"
						aria-label="Login with Linkedin"
						role="button"
						class="flex items-center justify-center w-full p-2 border rounded-md border-gray-500 hover:border-secondary-main hover:bg-[#ffc1071a]"
					>
						<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" class="w-5 h-5 fill-current">
							<path
								fill="#0078d4"
								d="M9,25H4V10h5V25z M6.501,8C5.118,8,4,6.879,4,5.499S5.12,3,6.501,3C7.879,3,9,4.121,9,5.499C9,6.879,7.879,8,6.501,8z M27,25h-4.807v-7.3c0-1.741-0.033-3.98-2.499-3.98c-2.503,0-2.888,1.896-2.888,3.854V25H12V9.989h4.614v2.051h0.065 c0.642-1.18,2.211-2.424,4.551-2.424c4.87,0,5.77,3.109,5.77,7.151C27,16.767,27,25,27,25z"
							/>
						</svg>
						<p class="text-gray-200 ml-2 text-sm">Continue with Linkedin</p>
					</button>
				</div>
				<div class="flex items-center w-full my-4">
					<hr class="w-full text-gray-400 border-divider-main" />
					<p class="px-3 text-gray-400">OR</p>
					<hr class="w-full text-gray-400 border-divider-main" />
				</div>
				<div class="mt-5 space-y-8">
					<div class="space-y-4">
						<div class="space-y-2">
							<div class="relative">
								<input
									id="email"
									type="email"
									class="text-white peer block w-full rounded-lg p-4 bg-background-paper text-sm outline-none placeholder:text-transparent autofill:pb-2 border border-transparent autofill:pt-6 focus:border-gray-500 focus:pb-2 focus:pt-6 disabled:pointer-events-none disabled:opacity-50 [&:not(:placeholder-shown)]:pb-2 [&:not(:placeholder-shown)]:pt-6"
									placeholder="you@email.com"
								/>
								<label
									id="emailLabel"
									class="pointer-events-none absolute start-0 top-0 h-full truncate border text-gray-500 border-transparent p-4 text-sm transition duration-100 ease-in-out peer-focus:-translate-y-3 peer-focus:text-[11px] peer-focus:text-gray-500 peer-disabled:pointer-events-none peer-disabled:opacity-50 peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-gray-500"
									>Username/Email</label
								>
								<div id="emailText" class="mt-2 text-error-main text-xs ml-3"></div>
							</div>
						</div>

						<div class="space-y-2">
							<div class="relative">
								<input
									id="password"
									type="password"
									class="text-white peer block w-full rounded-lg p-4 bg-background-paper text-sm outline-none placeholder:text-transparent autofill:pb-2 border border-transparent autofill:pt-6 focus:border-gray-500 focus:pb-2 focus:pt-6 disabled:pointer-events-none disabled:opacity-50 [&:not(:placeholder-shown)]:pb-2 [&:not(:placeholder-shown)]:pt-6"
									placeholder=""
								/>
								<button
									id="unhidePassword"
									class="!absolute right-1 top-2.5 z-50 select-none rounded py-2 px-4 text-center align-middle font-sans text-sm font-bold uppercase text-gray-500 transition-all hover:shadow-lg focus:opacity-[0.85] focus:shadow-none active:opacity-[0.85] active:shadow-none"
									type="button"
								>
									<span class="hidden"><i class="fas fa-eye"></i></span>
									<span><i class="fas fa-eye-slash"></i></span>
								</button>
								<label
									id="passwordLabel"
									class="pointer-events-none absolute start-0 top-0 h-full truncate border text-gray-500 border-transparent p-4 text-sm transition duration-100 ease-in-out peer-focus:-translate-y-3 peer-focus:text-[11px] peer-focus:text-gray-500 peer-disabled:pointer-events-none peer-disabled:opacity-50 peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-gray-500"
									>Password</label
								>
								<div id="passwordText" class="mt-2 text-error-main text-xs ml-3"></div>
							</div>
						</div>

						<div class="space-y-2">
							<div class="flex justify-end">
								<div class="form-control ml-1 hidden">
									<input
										checked
										id="checkbox"
										type="checkbox"
										value=""
										class="w-4 h-4 text-secondary-main bg-gray-100 border-gray-300 rounded focus:ring-secondary-main focus:ring-2"
									/>
									<label for="yellow-checkbox" class="ml-1 text-white align-text-bottom">Remember me</label>
								</div>
								<a rel="noopener noreferrer" href="/forgot-password" class="text-xs hover:underline text-secondary-main"
									>Forgot password?</a
								>
							</div>
						</div>
					</div>

					<button id="loginButton" type="button" class="outlined-button !w-full h-10 text-sm">
						<span>Sign In</span>
					</button>
				</div>

				<div class="flex items-center w-full my-4">
					<hr class="w-full border-divider-main" />
				</div>

				<p class="text-sm text-center text-gray-200">
					<a href="/register" rel="noopener noreferrer" class="hover:underline">Don't have an account?</a>
				</p>
			</div>
		</div>
		<div id="snackbar"></div>
	</body>

	<script type="module" src="/static/js/auth/login.js"></script>
	<script type="module" src="/static/js/auth/social_authentication.js"></script>
</html>

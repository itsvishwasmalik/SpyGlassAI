{% load static %}

<!doctype html>
<html data-theme="dark" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Reset Password</title>

		<!-- Tailwind CSS -->
		<link rel="stylesheet" href="/static/css/tailwind/output.css" />

		<!-- jQuery -->
		<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

		<!-- Font Awesome -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
		<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>

		<script src="/static/js/utils/components.js"></script>

		<script type="module" src="/static/js/config/ajax.js"></script>

		<link rel="shortcut icon" href="/static/favicon.ico" />
	</head>

	<body class="h-full w-full bg-background-paper">
		{% csrf_token %}

		<div class="flex justify-center items-center h-screen">
			<div class="w-full max-w-md p-4 rounded-md shadow-md sm:p-8 bg-primary-main mx-5">
				<h2 id="heading" class="mb-3 text-2xl font-semibold text-center text-secondary-main">Reset Password?</h2>
				<p class="text-sm text-center text-gray-400">
					<span id="subHeading">Enter your new password below and we'll reset password for your account</span>
					<span id="resetEmail" class="text-white"></span>
				</p>

				<div class="space-y-8 mt-5">
					<div class="space-y-4">
						<div class="space-y-2">
							<div class="relative">
								<input
									id="password"
									type="password"
									class="text-white peer block w-full rounded-lg p-4 bg-background-paper text-sm outline-none placeholder:text-transparent autofill:pb-2 border border-transparent autofill:pt-6 focus:border-gray-500 focus:pb-2 focus:pt-6 disabled:pointer-events-none disabled:opacity-50 [&:not(:placeholder-shown)]:pb-2 [&:not(:placeholder-shown)]:pt-6"
									placeholder=""
								/>
								<button
									id="unhidePassword"
									class="!absolute right-1 top-2.5 z-50 select-none rounded py-2 px-4 text-center align-middle font-sans text-sm font-bold uppercase text-gray-500 transition-all hover:shadow-lg focus:opacity-[0.85] focus:shadow-none active:opacity-[0.85] active:shadow-none"
									type="button"
								>
									<span class="hidden"><i class="fas fa-eye"></i></span>
									<span><i class="fas fa-eye-slash"></i></span>
								</button>
								<label
									id="passwordLabel"
									class="pointer-events-none absolute start-0 top-0 h-full truncate border text-gray-500 border-transparent p-4 text-sm transition duration-100 ease-in-out peer-focus:-translate-y-3 peer-focus:text-[11px] peer-focus:text-gray-500 peer-disabled:pointer-events-none peer-disabled:opacity-50 peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-gray-500"
									>Password</label
								>
								<div id="passwordText" class="mt-2 text-error-main text-xs ml-3"></div>
							</div>
							<div class="hidden ml-3 pt-3 pb-2" id="passwordStrengthContainer">
								<div id="passwordStrength" class="h-2 rounded-full" style="width: 25%"></div>
								<div class="text-white text-xs ml-2 -mt-1" id="passwordStrengthLabel"></div>
							</div>
							<div class="relative">
								<input
									id="confirmPassword"
									type="password"
									class="text-white peer block w-full rounded-lg p-4 bg-background-paper text-sm outline-none placeholder:text-transparent autofill:pb-2 border border-transparent autofill:pt-6 focus:border-gray-500 focus:pb-2 focus:pt-6 disabled:pointer-events-none disabled:opacity-50 [&:not(:placeholder-shown)]:pb-2 [&:not(:placeholder-shown)]:pt-6"
									placeholder=""
								/>
								<label
									id="confirmPasswordLabel"
									class="pointer-events-none absolute start-0 top-0 h-full truncate border text-gray-500 border-transparent p-4 text-sm transition duration-100 ease-in-out peer-focus:-translate-y-3 peer-focus:text-[11px] peer-focus:text-gray-500 peer-disabled:pointer-events-none peer-disabled:opacity-50 peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:text-gray-500"
									>Confirm Password</label
								>
								<div id="confirmPasswordText" class="mt-2 text-error-main text-xs ml-3"></div>
							</div>
							<div id="termsAndConditionsContainer" class="hidden items-center pt-3 ml-1">
								<label class="flex ml-2 text-sm font-medium text-gray-900">
									<input
										id="termsAndConditionsCheckbox"
										checked
										type="checkbox"
										value=""
										class="bg-gray-100 border-gray-300 rounded"
									/>
									<p class="ml-2 text-sm text-center text-gray-200">
										Agree with
										<span id="termsAndConditionsBtn" href="#" rel="noopener noreferrer" class="underline"
											>Terms & Conditions</span
										>
									</p></label
								>
							</div>
						</div>
					</div>

					<button id="resetButton" type="button" class="outlined-button !w-full h-10 text-sm">
						<span>Reset Password</span>
					</button>
				</div>

				<div class="flex items-center w-full my-4">
					<hr class="w-full border-divider-main" />
				</div>

				<p class="text-sm text-center text-gray-200">
					<a href="/login" rel="noopener noreferrer" class="hover:underline">Back to Login?</a>
				</p>
			</div>
		</div>
		<div id="snackbar"></div>
	</body>

	<script type="module" src="/static/js/auth/reset_password.js"></script>
</html>

{% include "others/t&c_modal.html" %}
